# Builds every release binary and publishes them as a GitHub release
# whenever a version tag is pushed:
#
#   git tag v1.0.2
#   git push origin v1.0.2
#
# The tagged commit is what gets built, and the tag name is stamped into the
# binary (shown by --version and in the TUI header).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build all platforms
        run: |
          set -eu
          NAME=vip-index-supervisor
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" -o "dist/${NAME}-$1-$2$3" .
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  arm64 ""
          build darwin  amd64 ""
          build windows amd64 ".exe"
          (cd dist && sha256sum ${NAME}-* > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
